server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { default_type application/json; return 200 '{"status":"UP","application":"yc-h5-test"}'; }
    location = /version.json { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /admin-api/ {
        proxy_pass http://backend:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ~ ^/(actuator|swagger|v3/api-docs|doc\.html) { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
}
