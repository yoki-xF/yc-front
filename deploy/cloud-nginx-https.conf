server {
    listen 80;
    server_name yc-test.yoki.ink;
    location ^~ /.well-known/acme-challenge/ { root /var/www/yc-test-acme; }
    location / { return 301 https://yc-test.yoki.ink$request_uri; }
}
server {
    listen 443 ssl;
    server_name yc-test.yoki.ink;
    ssl_certificate /etc/letsencrypt/live/yc-test-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yc-test-domain/privkey.pem;
    include /etc/nginx/snippets/proxy-tls.conf;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:15181;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
